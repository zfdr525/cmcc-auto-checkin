name: CMCC Daily Checkin

on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 修复 SSL 兼容性
        run: |
          sed -i 's/ssl.OP_LEGACY_SERVER_CONNECT/0x4/g' cmcc_session.py
          sed -i 's/ssl.OP_LEGACY_SERVER_CONNECT/0x4/g' cmcc_sign.py

      - name: 一键现签与签到
        env:
          CMCC_APP_TOKEN: ${{ secrets.CMCC_APP_TOKEN }}
          CMCC_SESSION_TEMPLATE: ${{ secrets.CMCC_SESSION_TEMPLATE }}
          CMCC_PHONE: ${{ secrets.CMCC_PHONE }}
        run: |
          python3 prepare.py
          python3 cmcc_session.py --refresh --config config.json
          python3 cmcc_sign.py --tasks --config config.json
