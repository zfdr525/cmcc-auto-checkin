- name: 一键现签 + 签到
  env:
    CMCC_APP_TOKEN: ${{ secrets.CMCC_APP_TOKEN }}
    CMCC_SESSION_TEMPLATE: ${{ secrets.CMCC_SESSION_TEMPLATE }}
    CMCC_PHONE: ${{ secrets.CMCC_PHONE }}
  run: |
    # 1. 生成基础 config.json
    echo "{\"phone\": \"$CMCC_PHONE\", \"app_token\": \"$CMCC_APP_TOKEN\"}" > config.json
    
    # 2. 用 Python 脚本自动拼装完整的 profile，解决 KeyError！
    python3 -c "
    import json, os, pathlib
    phone = os.environ.get('CMCC_PHONE', '')
    # 取尾号 4 位作为文件名
    suffix = phone[-4:] if phone else 'unknown'
    file_path = f'.cmcc_session_{suffix}.json'
    
    # 读取你传到 Secret 里的模板明文
    tpl = json.loads(os.environ.get('CMCC_SESSION_TEMPLATE', '{}'))
    
    # 拼装成脚本需要的完整 profile 结构
    profile = {
        'url': 'https://client.app.coc.10086.cn/biz-orange/LN/uamonekeylogin/autoLogin',
        'cookie': '',
        'template': tpl,
        'xk': tpl.get('xk', ''),
        'phone': phone
    }
    pathlib.Path(file_path).write_text(json.dumps(profile, ensure_ascii=False))
    "
    
    # 3. 强制现签
    python3 cmcc_session.py --refresh --config config.json
    
    # 4. 带着刚拿到的鲜活 cookie 去签到
    python3 cmcc_sign.py --tasks --config config.json
