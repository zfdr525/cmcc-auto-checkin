name: CMCC Daily Checkin

on:
  schedule:
    - cron: '10 0 * * *'   # 每天 UTC 0:10，即北京时间 8:10
  workflow_dispatch:       # 允许手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 修复 Python 3.10 的 SSL 兼容性
        run: |
          # 核心修复：把两个脚本里不兼容的常量强制替换掉！
          sed -i 's/ssl.OP_LEGACY_SERVER_CONNECT/0x4/g' cmcc_session.py
          sed -i 's/ssl.OP_LEGACY_SERVER_CONNECT/0x4/g' cmcc_sign.py

      - name: 一键现签 + 签到
        env:
          CMCC_APP_TOKEN: ${{ secrets.CMCC_APP_TOKEN }}
          CMCC_SESSION_TEMPLATE: ${{ secrets.CMCC_SESSION_TEMPLATE }}
          CMCC_PHONE: ${{ secrets.CMCC_PHONE }}
        run: |
          # 1. 生成基础 config.json
          echo "{\"phone\": \"$CMCC_PHONE\", \"app_token\": \"$CMCC_APP_TOKEN\"}" > config.json
          
          # 2. 还原 session 模板文件（脚本会自动去读这个文件进行现签）
          echo "$CMCC_SESSION_TEMPLATE" > .cmcc_session_2899.json
          
          # 3. 强制现签！用云端纯净 IP 拿最新的 Cookie，直接覆盖写入 config.json
          python3 cmcc_session.py --refresh --config config.json
          
          # 4. 带着刚拿到的鲜活 cookie 去签到
          python3 cmcc_sign.py --tasks --config config.json
