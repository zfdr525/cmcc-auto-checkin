name: CMCC Daily Checkin

on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 修复 SSL 兼容性
        run: |
          sed -i 's/ssl.OP_LEGACY_SERVER_CONNECT/0x4/g' cmcc_session.py
          sed -i 's/ssl.OP_LEGACY_SERVER_CONNECT/0x4/g' cmcc_sign.py

      - name: 极速现签与签到
        env:
          CMCC_APP_TOKEN: ${{ secrets.CMCC_APP_TOKEN }}
          CMCC_SESSION_TEMPLATE: ${{ secrets.CMCC_SESSION_TEMPLATE }}
          CMCC_PHONE: ${{ secrets.CMCC_PHONE }}
        run: |
          # 1. 写入基础配置
          echo "{\"phone\": \"$CMCC_PHONE\", \"app_token\": \"$CMCC_APP_TOKEN\"}" > config.json
          
          # 2. 用纯 Bash 拼接出完美的 profile JSON（解决 KeyError）
          # 注意这里把模板作为 template 字段，把 xk 硬编码为空字符串，避免解析报错
          echo "{\"url\": \"https://client.app.coc.10086.cn/biz-orange/LN/uamonekeylogin/autoLogin\", \"cookie\": \"\", \"template\": $CMCC_SESSION_TEMPLATE, \"xk\": \"\", \"phone\": \"$CMCC_PHONE\"}" > .cmcc_session_2899.json

          # 3. 执行现签和签到
          python3 cmcc_session.py --refresh --config config.json
          python3 cmcc_sign.py --tasks --config config.json
