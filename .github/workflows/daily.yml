name: CMCC Daily Checkin

on:
  schedule:
    # 北京时间 08:10 (UTC 00:10)
    - cron: '10 0 * * *'
    # 北京时间 20:10 (UTC 12:10)
    - cron: '10 12 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 生成临时配置 (供脚本读取)
        env:
          CMCC_PHONE: ${{ secrets.CMCC_PHONE }}
          CMCC_APP_TOKEN: ${{ secrets.CMCC_APP_TOKEN }}
          CMCC_SESSION_TEMPLATE: ${{ secrets.CMCC_SESSION_TEMPLATE }}
        run: |
          # 如果脚本支持环境变量，这步可忽略；为了保险，我们直接写一份 config.json
          cat <<EOF > config.json
          {
            "phone": "$CMCC_PHONE",
            "app_token": "$CMCC_APP_TOKEN",
            "session_template": $CMCC_SESSION_TEMPLATE
          }
          EOF

      - name: 现签 Session
        run: |
          # 如果文件存在说明模板有效，尝试现签
          python3 cmcc_session.py --refresh --config config.json || echo "现签失败，尝试使用旧 Token"
          
      - name: 执行签到
        run: |
          python3 cmcc_sign.py --tasks --config config.json
